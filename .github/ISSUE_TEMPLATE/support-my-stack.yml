name: Support my stack
description: Wiretap doesn't read a framework, ORM or HTTP client your project uses
labels: ["adapter"]
body:
  - type: input
    id: stack
    attributes:
      label: Framework or library
      description: What Wiretap should read, with its version.
      placeholder: "NestJS 10 controllers, Drizzle 0.38, tRPC 11…"
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: What Wiretap understood
      description: The output of `python3 -m wiretap index --root path/to/your/project`.
      render: text
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: The smallest code sample that shows the pattern
      description: A route declaration, a query, a client call. Leave out anything private.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you'd expect on the map
      placeholder: "GET /orders/:id linked to OrdersController.findOne, which reads the orders table"
